<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PicClear">
  <defs>
    <linearGradient id="brand" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F6BE6"/>
      <stop offset="0.55" stop-color="#3FB6C9"/>
      <stop offset="1" stop-color="#8E6BE6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="256" y1="40" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.22" r="0.9">
      <stop stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2E50C0" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- glass tile -->
  <rect x="48" y="48" width="416" height="416" rx="116" fill="url(#brand)" filter="url(#soft)"/>
  <rect x="48" y="48" width="416" height="416" rx="116" fill="url(#sheen)"/>
  <rect x="48" y="48" width="416" height="416" rx="116" fill="url(#gloss)"/>
  <rect x="49.5" y="49.5" width="413" height="413" rx="114.5" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>

  <!-- main sparkle (clarity) -->
  <path d="M256 130
           C272 214 298 240 382 256
           C298 272 272 298 256 382
           C240 298 214 272 130 256
           C214 240 240 214 256 130 Z"
        fill="#ffffff"/>
  <path d="M256 130
           C272 214 298 240 382 256
           C298 272 272 298 256 382
           C240 298 214 272 130 256
           C214 240 240 214 256 130 Z"
        fill="url(#gloss)" opacity="0.5"/>

  <!-- small sparkle -->
  <path d="M372 142
           C378 168 386 176 412 182
           C386 188 378 196 372 222
           C366 196 358 188 332 182
           C358 176 366 168 372 142 Z"
        fill="#ffffff" opacity="0.92"/>
</svg>
